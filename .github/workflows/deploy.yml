# APP_DEPLOY via homelab gh_webhooks (docs/DEPLOY.md §4b).
# Alignment invariant learned from the proven cron-agent pipeline:
#   the POSTed `tag` must be one the build actually pushed.
# metadata-action pushes `sha-<short7>` (type=sha, prefix=sha-) and the deploy
# step POSTs exactly `sha-<short7>`.
#
# Whitelist guidance (gh_webhooks/deploy_config.json):
#   "image": "ghcr.io/<owner>/<repo>"   + POST tag "sha-<short7>"
#
# Repo secrets: CF_ACCESS_CLIENT_ID/SECRET · HOMELAB_WEBHOOK_SECRET

name: Build & push ws-centrifugo-oauth image (GHCR)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to homelab via webhook (push to GHCR always happens)"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # lowercased automatically by metadata-action

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=ws-centrifugo-oauth
            org.opencontainers.image.description=Realtime wall — OAuth-verified token-issuer sidecar (mint + Server-API proxy) and the Centrifugo v6 WS bus hosting layout.

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image digest
        run: echo "Pushed ${{ steps.meta.outputs.tags }} @ ${{ steps.build.outputs.digest }}"

  deploy:
    needs: build
    if: github.event_name == 'push' || inputs.deploy == true
    runs-on: ubuntu-latest
    steps:
      - name: Trigger homelab deploy webhook (gh_webhooks)
        env:
          CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          HOOK_SECRET: ${{ secrets.HOMELAB_WEBHOOK_SECRET }}
        run: |
          # The pushed tag (metadata-action, type=sha,prefix=sha-) is sha-<short7>;
          # POST the same format here or the webhook pulls a tag that doesn't exist.
          TAG="sha-$(printf '%s' "${{ github.sha }}" | cut -c1-7)"
          BODY=$(jq -nc --arg repo "${{ github.repository }}" --arg tag "$TAG" '{repo:$repo, tag:$tag}')
          TS=$(date +%s)
          SIG=$(printf '%s.%s' "$TS" "$BODY" | openssl dgst -sha256 -hmac "$HOOK_SECRET" -r | cut -d' ' -f1)
          echo "Triggering webhook for ${BODY}"
          curl --fail-with-body --show-error --retry 3 --retry-all-errors --max-time 30 \
            --write-out '\nHTTP status: %{http_code}\n' \
            -H "CF-Access-Client-Id: $CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CLIENT_SECRET" \
            -H "X-Timestamp: $TS" -H "X-Signature: $SIG" \
            -H "Content-Type: application/json" --data "$BODY" \
            https://apis.adolfrey.com/gh_webhooks/d
